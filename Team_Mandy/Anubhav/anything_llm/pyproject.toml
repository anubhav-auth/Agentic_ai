[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docprep"
version = "0.1.0"
description = "Diagram-aware document ingestion for a local RAG pipeline (AnythingLLM)"
requires-python = ">=3.10"
dependencies = [
    "markitdown[pdf,docx,pptx,xlsx]>=0.1.0",
    "PyMuPDF>=1.24.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "watchdog>=4.0.0",
    "httpx>=0.27.0",
]

# Docling is the parser the lab names; it is heavy (pulls ML models), so it is
# optional. Install with:  pip install -e ".[docling]"
[project.optional-dependencies]
docling = ["docling>=2.0.0"]

[project.scripts]
docprep = "docprep.cli:main"

# src layout: the importable package lives under src/, so it can never be
# imported by accident from the working directory -- you run the installed
# package, not loose files.
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
